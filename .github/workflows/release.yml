name: Release

# Publishes the real Ember from main only, in three jobs on separate machines:
# "build" runs Gradle with no secrets; "inspect" checks the APK with no secrets;
# "sign-and-publish" runs only apksigner on the exact file "inspect" approved.
# The version is worked out from main's VERSION file and the run number in each
# job, never read from the build's output. Expected target SDK: see EXPECTED_TARGET_SDK.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  EXPECTED_TARGET_SDK: "36"   # raise together with targetSdk in app/build.gradle.kts

jobs:
  build:
    name: Check and build (no secrets)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          grep -Eqx '[0-9]+\.[0-9]+' VERSION || { echo "::error::VERSION must look like 0.1"; exit 1; }
          echo "EMBER_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EMBER_VERSION_NAME=$(cat VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Checks and unsigned release build
        run: ./gradlew check :app:assembleRelease --stacktrace

      - name: Check size budget
        run: scripts/check-apk-size.sh app/build/outputs/apk/release

      - name: Hand the unsigned release to the signing job
        uses: actions/upload-artifact@v4
        with:
          name: ember-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  inspect:
    name: Inspect the APK (no secrets)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.inspect.outputs.sha256 }}

    steps:
      - name: Checkout main (for the inspection script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 21 (for sdkmanager)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install pinned build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" > /dev/null
          bt="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$bt/aapt2" && test -x "$bt/apksigner" || { echo "::error::build-tools 36.0.0 did not install"; exit 1; }
          echo "BUILD_TOOLS=$bt" >> "$GITHUB_ENV"

      - name: Get the unsigned release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ember-release-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Inspect
        id: inspect
        run: |
          grep -Eqx '[0-9]+\.[0-9]+' VERSION || { echo "::error::VERSION must look like 0.1"; exit 1; }
          version="$(cat VERSION).${GITHUB_RUN_NUMBER}"
          apk="$(find "$RUNNER_TEMP/unsigned" -type f -name '*.apk' | head -n 1)"
          [ -n "$apk" ] || { echo "::error::No APK"; exit 1; }
          sha="$(scripts/inspect-apk.sh "$apk" io.github.waiphy0aung.ember "$((200000 + GITHUB_RUN_NUMBER))" "$version" "$EXPECTED_TARGET_SDK" | tail -n 1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

  sign-and-publish:
    name: Sign and publish (apksigner only)
    needs: [build, inspect]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the GitHub Release

    steps:
      - name: Checkout main (for the signing scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 21 (for apksigner)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install pinned build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" > /dev/null
          bt="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$bt/aapt2" && test -x "$bt/apksigner" || { echo "::error::build-tools 36.0.0 did not install"; exit 1; }
          echo "BUILD_TOOLS=$bt" >> "$GITHUB_ENV"

      - name: Get the unsigned release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ember-release-unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Make sure the checkout is untouched
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The checkout changed after download; refusing to sign"
            git status --porcelain
            exit 1
          fi

      - name: Sign with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.EMBER_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.EMBER_SIGNING_PASSWORD }}
          APPROVED_SHA256: ${{ needs.inspect.outputs.sha256 }}
        run: |
          version="$(cat VERSION).${GITHUB_RUN_NUMBER}"
          echo "EMBER_VERSION_NAME=$version" >> "$GITHUB_ENV"
          apk="$(find "$RUNNER_TEMP/unsigned" -type f -name '*.apk' | head -n 1)"
          mkdir -p "$RUNNER_TEMP/signed"
          scripts/sign-apk.sh "$apk" "$RUNNER_TEMP/signed/ember-${version}.apk" ember "$APPROVED_SHA256"

      - name: Check size budget
        run: scripts/check-apk-size.sh "$RUNNER_TEMP/signed"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${EMBER_VERSION_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists"
            exit 1
          fi
          gh release create "$tag" "$RUNNER_TEMP/signed/ember-${EMBER_VERSION_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ember ${EMBER_VERSION_NAME}" \
            --generate-notes \
            --latest
