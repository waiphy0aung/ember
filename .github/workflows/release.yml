name: Release

# Publishes the real Ember from main only. Runs main's own code, never a pull request's.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    name: Build and publish Ember
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          grep -Eqx '[0-9]+\.[0-9]+' VERSION || { echo "::error::VERSION must look like 0.1"; exit 1; }
          echo "EMBER_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EMBER_VERSION_NAME=$(cat VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Checks and unsigned release build (no secrets here)
        run: ./gradlew check :app:assembleRelease --stacktrace

      - name: Sign with the release key (no Gradle runs here)
        env:
          KEYSTORE_BASE64: ${{ secrets.EMBER_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.EMBER_SIGNING_PASSWORD }}
        run: |
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          mkdir -p signed
          scripts/sign-apk.sh "$apk" "signed/ember-${EMBER_VERSION_NAME}.apk" ember io.github.waiphy0aung.ember

      - name: Check size budget
        run: scripts/check-apk-size.sh signed

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${EMBER_VERSION_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          gh release create "$tag" "signed/ember-${EMBER_VERSION_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ember ${EMBER_VERSION_NAME}" \
            --generate-notes \
            --latest
