name: Release

# Publishes the real Ember from main only. Runs main's own code, never a pull request's.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    name: Build and publish Ember
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          grep -Eqx '[0-9]+\.[0-9]+' VERSION || { echo "::error::VERSION must look like 0.1"; exit 1; }
          echo "EMBER_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EMBER_VERSION_NAME=$(cat VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EMBER_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.EMBER_SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::A signing secret is missing; a release is never signed with a temporary key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ember.jks"

      - name: Checks and release build
        env:
          EMBER_KEYSTORE_PATH: ${{ runner.temp }}/ember.jks
          EMBER_KEYSTORE_PASSWORD: ${{ secrets.EMBER_SIGNING_PASSWORD }}
          EMBER_KEY_PASSWORD: ${{ secrets.EMBER_SIGNING_PASSWORD }}
          EMBER_KEY_ALIAS: ember
        run: ./gradlew check :app:assembleRelease --stacktrace

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/ember.jks"

      - name: Check size budget
        run: scripts/check-apk-size.sh app/build/outputs/apk/release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${EMBER_VERSION_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          apk_name="ember-${EMBER_VERSION_NAME}.apk"
          cp "$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)" "$apk_name"
          gh release create "$tag" "$apk_name" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ember ${EMBER_VERSION_NAME}" \
            --generate-notes \
            --latest
