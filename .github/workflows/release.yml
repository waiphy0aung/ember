name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    name: Build and publish Ember
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMBER_KEYSTORE_PASSWORD: ${{ secrets.EMBER_KEYSTORE_PASSWORD }}
      EMBER_KEY_ALIAS: ${{ secrets.EMBER_KEY_ALIAS }}
      EMBER_KEY_PASSWORD: ${{ secrets.EMBER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          echo "EMBER_VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EMBER_VERSION_NAME=$(cat VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EMBER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing key secret is missing; a release must never be signed with a temporary key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ember.jks"
          echo "EMBER_KEYSTORE_PATH=$RUNNER_TEMP/ember.jks" >> "$GITHUB_ENV"

      - name: Lint, unit tests and release build
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Check size budget
        run: scripts/check-apk-size.sh app/build/outputs/apk/release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${EMBER_VERSION_NAME}"
          apk_name="ember-${EMBER_VERSION_NAME}.apk"
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" "$apk_name"
          gh release create "$tag" "$apk_name" \
            --target "$GITHUB_SHA" \
            --title "Ember ${EMBER_VERSION_NAME}" \
            --generate-notes \
            --latest
