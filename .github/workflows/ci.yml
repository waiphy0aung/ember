name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # publish Ember Preview pre-releases
  pull-requests: write   # comment the preview link on the pull request

jobs:
  check-and-preview:
    name: Check and build Ember Preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMBER_KEYSTORE_PASSWORD: ${{ secrets.EMBER_KEYSTORE_PASSWORD }}
      EMBER_KEY_ALIAS: ${{ secrets.EMBER_KEY_ALIAS }}
      EMBER_KEY_PASSWORD: ${{ secrets.EMBER_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          echo "EMBER_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EMBER_VERSION_NAME=$(cat VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EMBER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ember.jks"
            echo "EMBER_KEYSTORE_PATH=$RUNNER_TEMP/ember.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret yet; this preview is signed with a temporary key and is not published."
          fi

      - name: Lint, unit tests and Ember Preview
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assemblePreview --stacktrace

      - name: Check size budget
        run: scripts/check-apk-size.sh app/build/outputs/apk/preview

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore

      - name: Publish Ember Preview
        if: env.EMBER_KEYSTORE_PATH != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="preview-pr${PR_NUMBER}-${GITHUB_RUN_NUMBER}"
          apk_name="ember-preview-${EMBER_VERSION_NAME}.apk"
          cp "$(find app/build/outputs/apk/preview -name '*.apk' | head -n 1)" "$apk_name"
          gh release create "$tag" "$apk_name" \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "Ember Preview ${EMBER_VERSION_NAME} (PR #${PR_NUMBER})" \
            --notes "Preview build for pull request #${PR_NUMBER}. Installs as Ember Preview, beside your real Ember, with its own separate data."
          gh pr comment "$PR_NUMBER" --body "Ember Preview **${EMBER_VERSION_NAME}-preview** is ready to try: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
