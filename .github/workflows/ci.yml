name: CI

# Runs code from pull requests, so it gets no secrets and a read-only token.
# Publishing Ember Preview happens in publish-preview.yml, which runs main's
# workflow file after this one succeeds.

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build Ember Preview
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          grep -Eqx '[0-9]+\.[0-9]+' VERSION || { echo "::error::VERSION must look like 0.1"; exit 1; }
          echo "EMBER_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EMBER_VERSION_NAME=$(cat VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Lint, unit tests and Ember Preview (unsigned)
        run: ./gradlew check :app:assemblePreview --stacktrace

      - name: Check size budget
        run: scripts/check-apk-size.sh app/build/outputs/apk/preview

      - name: Record the version for publishing
        run: printf '%s\n' "$EMBER_VERSION_NAME" > app/build/outputs/apk/preview/version.txt

      - name: Keep the unsigned preview for publishing
        uses: actions/upload-artifact@v4
        with:
          name: ember-preview-unsigned
          path: |
            app/build/outputs/apk/preview/*.apk
            app/build/outputs/apk/preview/version.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
